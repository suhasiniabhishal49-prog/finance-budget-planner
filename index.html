<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 32px 24px 24px 24px;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input, select, button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        input[type="number"] {
            width: 90px;
        }
        button {
            background: #4f8cff;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .summary div {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 6px;
            text-align: center;
            flex: 1;
            margin: 0 4px;
        }
        .transactions {
            margin-top: 16px;
        }
        .transactions h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .transaction.income {
            color: #22c55e;
        }
        .transaction.expense {
            color: #ef4444;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .technologies {
            margin-top: 32px;
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Finance Tracker</h1>
        <form id="transaction-form">
            <input type="text" id="desc" placeholder="Description" required />
            <input type="number" id="amount" placeholder="Amount" required />
            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <button type="submit">Add</button>
        </form>
        <div class="summary">
            <div>
                <div>Balance</div>
                <div id="balance">₹0</div>
            </div>
            <div>
                <div>Income</div>
                <div id="total-income">₹0</div>
            </div>
            <div>
                <div>Expense</div>
                <div id="total-expense">₹0</div>
            </div>
        </div>
        <div class="transactions">
            <h2>Transactions</h2>
            <ul id="transaction-list"></ul>
        </div>
        <div class="technologies">
            Built with <b>HTML</b>, <b>CSS</b>, and <b>JavaScript</b> (all in one file)
        </div>
    </div>
    <script>
        // Finance Tracker App Functionality
        const form = document.getElementById('transaction-form');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const transactionList = document.getElementById('transaction-list');
        const balanceEl = document.getElementById('balance');
        const incomeEl = document.getElementById('total-income');
        const expenseEl = document.getElementById('total-expense');

        let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');

        function updateSummary() {
            let income = 0, expense = 0;
            transactions.forEach(t => {
                if (t.type === 'income') income += t.amount;
                else expense += t.amount;
            });
            balanceEl.textContent = `₹${income - expense}`;
            incomeEl.textContent = `₹${income}`;
            expenseEl.textContent = `₹${expense}`;
        }

        function renderTransactions() {
            transactionList.innerHTML = '';
            transactions.forEach((t, idx) => {
                const li = document.createElement('li');
                li.className = `transaction ${t.type}`;
                li.innerHTML = `
                    <span>${t.desc}</span>
                    <span>${t.type === 'income' ? '+' : '-'}₹${t.amount}</span>
                    <button class="delete-btn" onclick="deleteTransaction(${idx})">&times;</button>
                `;
                transactionList.appendChild(li);
            });
        }

        function saveTransactions() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        window.deleteTransaction = function(idx) {
            transactions.splice(idx, 1);
            saveTransactions();
            renderTransactions();
            updateSummary();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const desc = descInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const type = typeInput.value;
            if (!desc || isNaN(amount) || amount <= 0) return;
            transactions.push({ desc, amount, type });
            saveTransactions();
            renderTransactions();
            updateSummary();
            form.reset();
        });

        // Initial render
        renderTransactions();
        updateSummary();
    </script>
</body>
</html>
